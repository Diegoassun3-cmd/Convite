name = "convite-solua"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Serve os arquivos estáticos de public/ diretamente (envelope, admin, css,
# js, fontes). O Worker só entra em ação para /api/* e /uploads/*.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/uploads/*"]

[[d1_databases]]
binding = "DB"
database_name = "convite-solua-db"
database_id = "58f2f53d-4cfd-4a69-965a-1ecd6cd9e7ea"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "936070460bf14258940c88e86a550976"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "convite-solua-uploads"

# SESSION_SECRET é um segredo, não fica aqui — defina com:
#   npx wrangler secret put SESSION_SECRET
